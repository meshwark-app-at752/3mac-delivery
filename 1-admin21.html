<!doctype html><html lang=ar><head><meta charset=utf-8></head><body>
<script>const ROLE='admin',TITLE='3mak Admin';</script>
<script src=/common.js></script>

<script>
let tab='orders',BOARD=[],BF='prob',BQ='',BR='',OPEN=0,CANX=0,ORD=[],REP=null,USERS=[],DISCS=[],NEWCODE='',FIL='today',SETV=null,LASTUSERS='';
const STS=[['today','النهاردة'],['new','جديد'],['accepted','اتقبل'],['ready','جاهز'],['picked','في الطريق'],['delivered','اتسلم'],['rejected','مرفوض'],['cancelled','ملغي'],['failed','تعذر']];
let CIS=[],UQ='',CISF='open',ACC='rep';
const STC={pay:'#7B1FA2',new:'#1976D2',accepted:'#EF6C00',ready:'#F9A825',picked:'#00897B',delivered:'#2E7D32',rejected:'#757575',cancelled:'#757575',failed:'#C62828'};
function stc(st){return STC[st]||'#757575'}
function schip(st){return `<span class=sc style="background:${stc(st)}">${esc(SA[st]||st)}</span>`}
const CK={released_offline:'الأوردر رجع لكل الطيارين (الطيار فصل قبل الاستلام)',offline_after_pickup:'الطيار فصل بعد ما استلم (الأوردر كمل معاه)',no_courier_available:'مفيش طيار متاح للأوردر (كلهم اتعرض عليهم أو مفيش حد ظاهر)',restaurant_no_location:'المطعم من غير موقع متسجل',suspicious_action:'محاولة مشبوهة من طيار',second_round:'اتعرض تاني مرة واحدة بعد 10 دقايق'};
const SA={new:'جديد',accepted:'اتقبل',ready:'جاهز',picked:'مع الطيار',delivered:'اتسلم',failed:'تعذر التوصيل',cancelled:'اتلغى',rejected:'اترفض'};const EK={placed:'الطلب اتبعت',accepted:'المطعم قبل',ready:'جاهز',picked:'طيار أخد الأوردر',collected:'الطيار استلم الأكل',delivered:'اتسلم',released:'الأوردر رجع للطيارين',failed:'تعذر',cancelled:'اتلغى',rejected:'اترفض',paid:'دفع',payreq:'طلب دفع'};
function tm(t){return t?new Date(t*1000).toLocaleString('ar-EG'):'-'}
function cisH(){const nb=CIS.filter(i=>!i.resolved_at).length;const pl=`<div class=pills><button class="sm ${CISF=='open'?'on':''}" onclick="CISF='open';render()">مفتوحة (${nb})</button><button class="sm ${CISF=='done'?'on':''}" onclick="CISF='done';render()">اتحلت (${CIS.length-nb})</button><button class="sm ${CISF=='all'?'on':''}" onclick="CISF='all';render()">الكل</button></div>`;const LL=CIS.filter(i=>CISF=='all'||(CISF=='open')==!i.resolved_at);if(!LL.length)return pl+'<div class=card>'+(CISF=='open'?'مفيش مشاكل مفتوحة ✔':'مفيش حاجة هنا')+'</div>';return pl+LL.map(i=>{const c=i.courier||{},o=i.order||{},ex=i.extra||{};const mp=c.last_lat?`<a href="https://maps.google.com/?q=${c.last_lat},${c.last_lng}" target=_blank>افتح آخر موقع</a>`:'مفيش موقع متسجل';const bx=[];
  if(c.name)bx.push(['الطيار',esc(c.name)+(c.contact?' · '+esc(c.contact):'')]);
  if(i.offline_since)bx.push(['انقطع من',tm(i.offline_since)]);
  if(c.name){bx.push(['آخر ظهور',tm(c.last_seen_at)]);bx.push(['آخر موقع',mp])}
  bx.push(['الطلب','#'+i.order_id+' · '+esc((o.restaurant||{}).name||'')],['العميل',esc(o.name||'')+' · '+esc(o.phone||'')],['العنوان',esc(o.address||''),1],['الإجمالي',money(o.total||0)],['الحالة',schip(o.status)+' ← '+schip(i.order_status_now)],['اللي حصل',esc(ex.rule||''),1]);
  if(i.resolution)bx.push(['النتيجة',esc(i.resolution),1]);
  return `<div class=card style="border-right:6px solid ${i.resolved_at?'#2E7D32':(i.kind=='suspicious_action'?'#C62828':'#EF6C00')}"><div class=row><b>${esc(CK[i.kind]||i.kind)}</b>${i.resolved_at?'<span class=sc style="background:#2E7D32">اتحلت</span>':''}</div><small>اتسجلت ${tm(i.created)}</small>${OUI.boxes(bx)}<details class=tlw><summary>الخط الزمني للأوردر</summary><small>${(o.events||[]).map(e=>tm(e.ts)+' · '+esc(EK[e.kind]||e.kind)+' '+esc(e.who||'')+' '+esc(e.note||'')).join('<br>')}</small></details></div>`}).join('')}
async function loadTab(){
 if(tab=='orders'){await loadBoard()}
 else if(tab=='rest'||tab=='cour'){const r=await api('admin/users');if(r)USERS=r}
 else if(tab=='acc'){if(ACC=='rep'){const r=await api('admin/report');if(r)REP=r}else{const r=await api('admin/discounts');if(r)DISCS=r}}
 else if(tab=='cis'){const r=await api('admin/courier_issues');if(r)CIS=r}
 else if(tab=='set'){const r=await fetch('/api/settings').then(r=>r.json());SETV=r}}
async function loadBoard(){const r=await api('orders?view=board');if(r){BOARD=r;window.__LA=Date.now()}if(!window.__UT||Date.now()-window.__UT>60000){const u=await api('admin/users');if(u){USERS=u;window.__UT=Date.now()}}}
const CL=['#F55906','#D32F2F'];
function probs(o){const P=[],pt=(BOARD[0]&&BOARD[0].pt)||{tpl:{},stuck:120,held:2400},el=(Date.now()-(window.__LA||Date.now()))/1000,mn=a=>Math.max(1,Math.floor((a+el)/60));
 if(o.status=='pay')P.push({k:'pay',t:'تدخل الآن: في انتظار تأكيد الدفع ('+(PAYL[o.pay_method]||'')+')',snd:0});
 if(o.status=='new'&&o.created_age>pt.stuck)P.push({k:'new',t:pt.tpl.new.replace('{m}',mn(o.created_age)),snd:0});
 if((o.status=='ready'||o.status=='accepted')&&!o.courier_id&&o.avail_age!=null&&o.avail_age>pt.stuck)P.push({k:'nocourier',t:(o.rel_n?pt.tpl.released:pt.tpl.nocourier).replace('{m}',mn(o.avail_age)),snd:o.rel_n});
 if(o.status=='failed')P.push({k:'failed',t:pt.tpl.failed.replace('{note}',o.fail_reason||''),snd:1});
 if(o.status=='picked'&&o.held_age!=null&&o.held_age>pt.held)P.push({k:'held',t:pt.tpl.held.replace('{m}',mn(o.held_age)),snd:0});
 return P}
var PAYL={vodafone:'فودافون كاش',instapay:'إنستا باي',cash:'كاش'};
function payH(o){if(!o.pay_method||o.pay_method=='cash')return '';var w=o.status=='pay';return OUI.boxes([['طريقة الدفع',PAYL[o.pay_method]+(w?' (لم يتأكد)':' (تم التأكيد)')],['رقم العملية (آخر 4)',esc(o.pay_ref||'')],['المبلغ المطلوب',money(o.total)]])+(o.has_img?'<button class="alt sm" onclick="payShow('+o.id+')">عرض الإيصال</button>':'')+(w?'<button class="sm" style="background:#2E7D32;color:#fff" onclick="payOK('+o.id+')">✔ تم استلام الدفع</button>':'')}
async function payShow(id){const r=await api('admin/pay_img?id='+id);if(!r||!r.img)return toast('لا توجد صورة');const v=document.createElement('div');v.className='ov';v.onclick=function(){v.remove()};v.innerHTML='<img src="'+r.img+'" style="max-width:100%;max-height:90vh;border-radius:8px">';document.body.appendChild(v)}
async function payOK(id){const r=await api('order_action',{id,action:'confirm_pay'});if(r){toast('تم تأكيد الدفع، الطلب اتحول للمطعم');await loadBoard();render()}}
function isClosed(o){return ['delivered','rejected','cancelled','failed'].includes(o.status)}
function bcard(o){const P=probs(o),op=OPEN==o.id,cl=isClosed(o),col=stc(o.status);
 let h=`<div class=card style="border-right:6px solid ${col}"><div class=row onclick="OPEN=${op?0:o.id};render()" style="cursor:pointer"><b>${esc(o.rest_name)} <small>#${o.id}</small> ${schip(o.status)}</b><small>${timeAgo(o.created)} ${op?'▴':'▾'}</small></div>
 <div onclick="OPEN=${op?0:o.id};render()" style="cursor:pointer">${OUI.line(Object.assign({},o,{need:''}))}</div>`;
 if(P.length)h+=P.map(p=>'<div class="nd w">'+esc(p.t)+'</div>').join('');
 h+=OUI.stage(o)+payH(o);
 const it=o.items.map(i=>i.qty+' × '+esc(i.name)).join('، ');
 if(!op)h+=`<div style="font-size:13px;color:#3A3A3A">${esc(o.name||'')} · ${money(o.total)}${o.courier_name?' · '+esc(o.courier_name):''}</div>`;
 if(op){h+=OUI.boxes([['العميل',esc(o.name||'')+' · '+esc(o.phone||'')],['الإجمالي',money(o.total)],['العنوان',esc(o.address||''),1],['الأصناف',it,1],['الطيار',o.courier_name?esc(o.courier_name):''],['أكل + توصيل',money(o.subtotal)+' + '+money(o.fee)+(o.discount?' - '+money(o.discount):'')],['ملاحظة',o.note?esc(o.note):'',1]])+OUI.tl(o,true);
  if(o.phone)h+=`<button class="sm alt" data-u="tel:${esc(String(o.phone).replace(/[^0-9+]/g,''))}" onclick="openExt(this.dataset.u)">📞 العميل</button>`;
  if(!cl)h+=CANX==o.id?'<div>سبب الإلغاء:</div>'+CR.map((r,i)=>`<button class=red onclick="cancelO(${o.id},${i})">${r}</button>`).join('')+`<button class="alt bkb" onclick="CANX=0;render()">رجوع</button>`:`<button class="red sm" onclick="CANX=${o.id};render()">إلغاء الطلب</button>`+(o.status=='picked'&&!o.collected_at&&o.courier_id?(RELX==o.id?'<div class=nd>اختار سبب سحب الأوردر</div>'+WR.map(function(r,i){return '<button class=red onclick="relO('+o.id+','+i+')">'+r+'</button>'}).join('')+'<button class="alt bkb" onclick="RELX=0;render()">رجوع</button>':'<button class="alt sm" onclick="RELX='+o.id+';render()">سحب الأوردر من الطيار</button>'):'')}
 else h+=OUI.tl(o);
 return h+'</div>'}
const CR=['بناءً على طلب العميل','تعذر التنفيذ من المطعم','لا يتوفر طيار حاليًا','الطلب غير صحيح'];
function openExt(u){try{if(window.Android&&Android.openUrl){Android.openUrl(u)}else{location.href=u}}catch(e){toast('مقدرتش أفتح الرابط')}}
function boardH(){const FL=[['prob','تدخل الآن'],['act','شغالة'],['today','النهاردة'],['done','اتسلمت'],['bad','ملغية/فاشلة']];
 const rs=[...new Set([...USERS.filter(u=>u.role=='restaurant').map(u=>u.name),...BOARD.map(o=>o.rest_name)].filter(Boolean))].sort((x,y)=>String(x).localeCompare(String(y),'ar'));
 let L=BOARD.filter(o=>{if(BR&&o.rest_name!=BR)return false;if(BQ){const q=BQ.trim();if(!(('#'+o.id).includes(q)||String(o.id)==q||(o.phone||'').includes(q)||(o.name||'').includes(q)))return false}
  return BF=='prob'?probs(o).length>0:BF=='act'?!isClosed(o):BF=='done'?o.status=='delivered':BF=='bad'?['rejected','cancelled','failed'].includes(o.status):true});
 L.sort((a,b)=>{const pa=probs(a).length>0,pb=probs(b).length>0;if(pa!=pb)return pa?-1:1;const ca=isClosed(a),cb=isClosed(b);if(ca!=cb)return ca?1:-1;return ca?b.id-a.id:a.id-b.id});
 const np=BOARD.filter(o=>probs(o).length).length;
 return '<div class=tabs style="margin-top:6px;flex-wrap:wrap">'+FL.map(f=>`<button class="sm ${BF==f[0]?'on':''}" style="font-size:13px;padding:8px 6px" onclick="BF='${f[0]}';render()">${f[1]}${f[0]=='prob'&&np?' '+np:''}</button>`).join('')+'</div>'
 +`<div class=row><input id=bq placeholder="ابحث برقم الطلب أو الاسم أو التليفون" value="${esc(BQ)}" oninput="BQ=this.value;clearTimeout(window.__bt);window.__bt=setTimeout(render,500)" style="flex:1;min-width:0"><select id=br onchange="BR=this.value;render()" style="width:auto;max-width:45%;min-width:0"><option value="">كل المطاعم</option>${rs.map(r=>`<option${BR==r?' selected':''}>${esc(r)}</option>`).join('')}</select></div>`
 +(L.length?L.map(bcard).join(''):'<div class=card>'+(BF=='prob'?'مفيش حاجة محتاجة تدخل ✔':'مفيش طلبات')+'</div>')}
function nOpenCis(){return CIS.filter(i=>!i.resolved_at).length}
function nProb(){return BOARD.filter(o=>probs(o).length).length}
function bdg(n,red){return n?`<i class="bd${red?' r':''}">${n}</i>`:''}
function tabsH(){const t=[['orders','الأوردرات',bdg(nProb(),1)],['rest','المطاعم',''],['cour','الطيارين',''],['cis','مشاكل طيارين',bdg(nOpenCis(),1)],['acc','الحسابات',''],['set','الإعدادات','']];return '<div class=nav>'+t.map(x=>`<button class="${tab==x[0]?'on':''}" onclick="sw('${x[0]}')">${x[1]}${x[2]}</button>`).join('')+'</div>'}
function sumH(){const c=st=>BOARD.filter(o=>st.includes(o.status)).length;const it=[['جديد',c(['pay','new']),'#1976D2',"new"],['بيتجهز',c(['accepted','ready']),'#EF6C00',"act"],['في الطريق',c(['picked']),'#00897B',"act"],['تدخل الآن',nProb(),'#C62828',"prob"],['اتسلم النهاردة',c(['delivered']),'#2E7D32',"done"]];return '<div class=sum>'+it.map(x=>`<div class=sx style="border-top:4px solid ${x[2]}" onclick="BF='${x[3]}';sw('orders')"><b style="color:${x[2]}">${x[1]}</b><small>${x[0]}</small></div>`).join('')+'</div>'}
function updTop(){const a=document.getElementById('sumb');if(a)a.innerHTML=sumH();const n=document.getElementById('navb');if(n)n.innerHTML=tabsH()}
async function sw(t){tab=t;UQ='';OPEN=0;await loadTab();render();window.scrollTo(0,0)}
function oCard(o){return `<div class=card><div class=row><b>${esc(o.rest_name)} #${o.id}</b></div><small>${esc(o.name)} · ${esc(o.phone)} · ${timeAgo(o.created)}</small><br>${o.items.map(i=>i.qty+' × '+esc(i.name)).join('، ')}<br><small>${esc(o.address)}${o.note?' · 📝 '+esc(o.note):''}</small>
 <div class=row><span>الإجمالي</span><b>${money(o.total)}</b></div><small>أكل ${money(o.subtotal)} + توصيل ${money(o.fee)}${o.discount?' - خصم '+money(o.discount)+' ('+esc(o.discount_code)+' على '+(o.discount_by=='owner'?'المالك':'المطعم')+')':''}</small>
 ${o.reject_reason?'<br><small>سبب الرفض: '+esc(o.reject_reason)+'</small>':''}${o.fail_reason?'<br><small>سبب التعذر: '+esc(o.fail_reason)+'</small>':''}
 ${['new','accepted','ready','picked'].includes(o.status)?`<br><button class="red sm" onclick="cancelO(${o.id})">إلغاء الطلب</button>`:''}</div>`}
let RELX=0;const WR=['الطيار طلب الانسحاب','الطيار متأخر','تعذر الوصول للطيار'];
async function relO(id,i){const r=await api('order_action',{id,action:'release',reason:WR[i]});RELX=0;if(r){toast('تم سحب الأوردر');await loadBoard();render()}}
async function cancelO(id,i){const r=await api('order_action',{id,action:'cancel',reason:CR[i]});CANX=0;if(r){toast('تم الإلغاء');await loadBoard();render()}}
function box(t,s){return `<div class=card><h3>${t}</h3><div class=row><span>عدد الطلبات المسلّمة</span><b>${s.count}</b></div><div class=row><span>مبيعات الأكل</span><b>${money(s.subtotal)}</b></div><div class=row><span>رسوم التوصيل</span><b>${money(s.fees)}</b></div><div class=row><span>خصومات على المالك</span><b>- ${money(s.discount_owner)}</b></div><div class=row><span>خصومات على المطاعم</span><b>${money(s.discount_rest)}</b></div><div class=row><b>أرباحك (توصيل - خصم المالك)</b><b>${money(s.fees-s.discount_owner)}</b></div><div class=row><span>إجمالي الكاش المتحصّل</span><b>${money(s.total)}</b></div></div>`}
const SN={new:'جديد',accepted:'اتقبل',ready:'جاهز',picked:'في الطريق',delivered:'اتسلم',rejected:'مرفوض',cancelled:'ملغي',failed:'تعذر'};
function repH(){if(!REP)return '';let h=box('النهاردة',REP.today)+'<div class=card><b>عدد طلبات النهاردة حسب الحالة</b><br>'+(Object.keys(REP.status_today).length?Object.entries(REP.status_today).map(([k,v])=>`<span class=chip>${SN[k]||k}: ${v}</span>`).join(''):'<small>لسه مفيش</small>')+'</div>';
 h+=box('آخر 7 أيام',REP.week)+box('الكل',REP.all);
 h+='<div class=card><h3>المطاعم (النهاردة)</h3>'+REP.restaurants.map(r=>`<div class=row><span>${esc(r.name)}</span><span>${r.delivered} طلب · ${money(r.subtotal)}</span></div>`).join('')+'</div>';
 h+='<div class=card><h3>الطيارين (النهاردة)</h3>'+REP.couriers.map(r=>`<div class=row><span>${esc(r.name)}</span><span>${r.delivered} اتسلم · ${r.failed} تعذر · كاش ${money(r.cash)}</span></div>`).join('')+'</div>';
 return h}
const CATN={rest:'مطاعم',groc:'بقالة',pharm:'صيدليات',shop:'المتاجر'};function catSel(id,v){return `<select id=${id} style="width:auto">${Object.keys(CATN).map(k=>`<option value=${k}${(v||'rest')==k?' selected':''}>${CATN[k]}</option>`).join('')}</select>`}
var UN={};function askStop(id){var d=document.createElement('div');d.className='ov';d.innerHTML='<div class=card style="text-align:center"><h3>إيقاف الحساب</h3><p>هل تريد إيقاف <b id=asn></b>؟ لن يستطيع الدخول أو استقبال الطلبات حتى تعيد تفعيله.</p><button class=red id=asy>تأكيد الإيقاف</button><button class=alt id=asb>رجوع</button></div>';document.body.appendChild(d);d.querySelector('#asn').textContent=UN[id]||'هذا الحساب';d.querySelector('#asb').onclick=function(){d.remove()};d.querySelector('#asy').onclick=function(){d.remove();utog(id)}}
function userCard(u){UN[u.id]=u.name;const r=u.role=='restaurant';return `<div class=card><div class=row><b>${esc(u.name)}</b><span class=chip>${r?(CATN[u.cat||'rest']||'مطعم'):'طيار'}${u.active?'':' · موقوف'}</span></div><small>الكود: <b>${esc(u.code)}</b></small>
 ${r?`<div class=row style="flex-wrap:wrap">${u.hasp?`<img src="/rpic/${u.rid}?v=${Date.now()}" style="width:90px;height:50px;object-fit:cover;border-radius:8px">`:'<small>مفيش صورة</small>'}<button class="sm alt" onclick="document.getElementById('rp${u.id}').click()">📷 صورة المطعم</button>${u.hasp?`<button class="sm red" onclick="rpDel(${u.rid})">مسح الصورة</button>`:''}<input type=file accept="image/*" id=rp${u.id} style="display:none" onchange="rpUp(${u.rid},this)"></div>${u.promo?`<small>خصم المطعم: ${esc(u.promo)}</small>`:''}<div class=row style="flex-wrap:wrap"><small>القسم</small>${catSel('ct'+u.id,u.cat)}<small>التوصيل</small><input id=fee${u.id} value="${u.fee}" inputmode=decimal style="width:80px"><label><input type=checkbox id=ft${u.id} style="width:auto" ${u.featured?'checked':''}> مميز</label><label><input type=checkbox id=sf${u.id} style="width:auto" ${u.show_fee===0?'':'checked'}> إظهار سعر التوصيل للعميل</label><br><small>${u.lat!=null?'📍 الموقع متسجل':'⚠️ مفيش موقع'}</small><input id=lc${u.id} placeholder="الموقع: 30.123456, 31.123456" value="${u.lat!=null?u.lat+', '+u.lng:''}"><button class="sm" onclick="setR(${u.rid},${u.id})">حفظ</button></div>`:''}
 <button class="sm ${u.active?'red':''}" onclick="${u.active?`askStop(${u.id})`:`utog(${u.id})`}">${u.active?'إيقاف':'إعادة تفعيل'}</button></div>`}
async function rpUp(id,inp){const f=inp.files[0];if(!f)return;toast('بجهز الصورة...');try{const d=await resizeImage(f,640);const r=await api('admin/rest_photo',{id,data:d});if(r){toast('تم رفع الصورة');await loadTab();render()}}catch(e){toast('الصورة مش مناسبة')}}
async function rpDel(id){if(!confirm('تمسح صورة المطعم؟'))return;const r=await api('admin/rest_photo_delete',{id});if(r){toast('تم المسح');await loadTab();render()}}
async function setR(rid,uid){const r=await api('admin/restaurant_set',{id:rid,fee:$('#fee'+uid).value,featured:$('#ft'+uid).checked,show_fee:$('#sf'+uid).checked,cat:$('#ct'+uid).value,loc:$('#lc'+uid).value});if(r){toast('تم الحفظ');await loadTab();render()}}
async function utog(id){const r=await api('admin/user_toggle',{id});if(r){await loadTab();render()}}
