<!doctype html><html lang=ar><head><meta charset=utf-8></head><body>
<script>const ROLE='courier',TITLE='3mac - الطيار';</script>
<script src=/common.js></script>
<script>
let HID=JSON.parse(localStorage.getItem('hid3')||'[]');let tab='orders',ORD=[],REC=null,seen=null,FAILID=0;
const FR=['العميل مردش','العنوان غلط','العميل رفض الاستلام','مشكلة في الأوردر'];
async function load(){const [o,r]=await Promise.all([api('orders'),api('my/record')]);if(o){ORD=o;const rd=o.filter(x=>x.status=='ready'||x.status=='accepted').map(x=>x.id);if(seen===null){seen=new Set(rd);if(rd.length)beep(2)}else{const f=rd.filter(i=>!seen.has(i));f.forEach(i=>seen.add(i));if(f.length){beep(3);toast('أوردر جاهز!')}}}if(r)REC=r}
function oCard(o){const mine=o.status=='picked';const items=o.items.map(i=>i.qty+' × '+esc(i.name)).join('، ');
 let h=`<div class="card ${o.status!='picked'?'new':''}"><div class=row><b>${esc(o.rest_name)} #${o.id}</b></div><div>${items}</div>${OUI.line(o)}<div class=row><span>تحصّل كاش:</span><b>${money(o.total)}</b></div><small>رسوم التوصيل: ${money(o.fee)}</small>`;
 if(o.status=='ready'||o.status=='accepted')h+=`<br><button onclick="take(${o.id})">قبول</button><button class="red" onclick="rej(${o.id})">رفض</button>`;
 if(mine&&!o.collected_at){h+=!o.ready_at?'<div class=banner>جاري التجهيز، روح المطعم</div>':`<div class=banner>الأوردر جاهز</div><button onclick="collect(${o.id})">تم الاستلام</button>`}
 else if(mine){h+=`<div style="margin-top:6px"><b>${esc(o.name)}</b><br>${esc(o.address)}${o.note?'<br><small>📝 '+esc(o.note)+'</small>':''}</div>
  <button data-u="tel:${esc(String(o.phone).replace(/[^0-9+]/g,''))}" onclick="openExt(this.dataset.u)">📞 اتصل بالعميل ${esc(o.phone)}</button>
  <button class=alt data-u="${o.lat!=null&&o.lng!=null?'https://www.google.com/maps/search/?api=1&query='+o.lat+','+o.lng:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(o.address)}" onclick="openExt(this.dataset.u)">🗺️ افتح الخريطة</button>
  <br>${FAILID==o.id?'<div>سبب تعذر التوصيل:</div>'+FR.map((r,i)=>`<button class=red onclick="fail(${o.id},${i})">${r}</button>`).join('')+'<button class="alt bkb" onclick="FAILID=0;render()">رجوع</button>':`<button onclick="deliver(${o.id})">✔ تم التوصيل</button><button class="red alt" onclick="FAILID=${o.id};render()">تعذر التوصيل</button>`}</div>`}
 h=h.replace('<div class=banner>جاري التجهيز، روح المطعم</div>','').replace('<div class=banner>الأوردر جاهز</div>','');
 if(mine&&!o.collected_at)h+=REL==o.id?'<div>متأكد إنك عايز تسيب الأوردر؟ هيرجع لكل الطيارين.</div><button class=red onclick="rel('+o.id+')">أيوه سيب الأوردر</button><button class="alt bkb" onclick="REL=0;render()">لأ، رجوع</button>':'<button class="red alt sm" onclick="REL='+o.id+';render()">سيب الأوردر</button>';
 return h+OUI.tl(o,false,false)+'</div>'}
let REL=0;
async function rel(id){const r=await api('order_action',{id,action:'release'});REL=0;if(r){HID.push(id);localStorage.setItem('hid3',JSON.stringify(HID.slice(-100)));toast('الأوردر رجع لكل الطيارين')}await load();render()}
function openExt(u){try{if(window.Android&&Android.openUrl){Android.openUrl(u)}else{location.href=u}}catch(e){toast('مقدرتش أفتح الرابط')}}
function rej(id){HID.push(id);localStorage.setItem('hid3',JSON.stringify(HID.slice(-100)));render()}
async function take(id){const r=await api('order_action',{id,action:'take'});if(r)toast('الأوردر معاك');await load();render()}
async function collect(id){const r=await api('order_action',{id,action:'collect'});if(r)toast('تمام، استلمت الأكل');await load();render()}
async function deliver(id){const r=await api('order_action',{id,action:'deliver'});if(r)toast('تم التسليم ✔');await load();render()}
async function fail(id,i){const r=await api('order_action',{id,action:'fail',reason:FR[i]});FAILID=0;if(r)toast('تم التسجيل');await load();render()}
function render(){let h='<div class=tabs><button class="'+(tab=='orders'?'on':'')+'" onclick="tab=\'orders\';render()">الأوردرات</button><button class="'+(tab=='rec'?'on':'')+'" onclick="tab=\'rec\';render()">سجل النهاردة</button></div>';
 if(tab=='orders'){const mine=ORD.filter(o=>o.status=='picked'),rd=ORD.filter(o=>(o.status=='ready'||o.status=='accepted')&&!HID.includes(o.id));
  h+=(mine.length?'<h3>معايا</h3>'+mine.map(oCard).join(''):'')+'<h3>أوردرات جديدة</h3>'+(rd.length?rd.map(oCard).join(''):'<div class=card>مفيش أوردرات متاحة دلوقتي</div>')}
 else if(REC){h+=`<div class=card><h3>سجل النهاردة</h3><div class=row><span>اتسلّم</span><b>${REC.delivered}</b></div><div class=row><span>تعذر تسليمه</span><b>${REC.failed}</b></div><div class=row><span>إجمالي الكاش اللي اتحصّل</span><b>${money(REC.cash)}</b></div><div class=row><span>منه رسوم توصيل</span><b>${money(REC.fees)}</b></div><small>ده سجل بس للمتابعة.</small></div>`+REC.orders.map(o=>`<div class="card row"><span>#${o.id}</span><span>${money(o.total)}</span></div>`).join('')}
 const sc=window.scrollY;$('#app').innerHTML=h;window.scrollTo(0,sc)}
start(()=>{watch(async()=>{await load();render()},4000)});
</script><script>(function(){var s=document.createElement('style');s.id='th2';s.textContent=':root,[data-theme=dark],[data-theme=light]{--bg:#fff;--card:#fff;--fg:#1F1F1F;--mut:#6B6B6B;--gold:#F55906;--inp:#fff;--btn2:#F8ECDE}html,body{background:#fff!important;color:#1F1F1F;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-size:16px}header{background:#F55906;color:#fff;border-bottom:0;padding:14px 16px;box-shadow:0 2px 10px rgba(245,89,6,.25)}header b{color:#fff;font-size:20px;font-weight:800}header button,header button.alt{background:rgba(255,255,255,.22);color:#fff;border-radius:999px;font-size:14px;padding:7px 12px}#thm{display:none}#app{padding:12px}.card{background:#fff;color:#1F1F1F;border:1px solid #EEE;border-radius:18px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}.card.new,.new{border:2px solid #F55906}h2,h3{color:#1F1F1F;font-size:18px;font-weight:800;margin:8px 0}h2{font-size:20px}small,.mut{color:#6B6B6B;font-size:13px}a{color:#F55906}.st{color:#F55906;font-weight:800}input,select,textarea{background:#fff;color:#1F1F1F;border:1.5px solid #E5E5E5;border-radius:12px;padding:11px 12px;font-size:16px}input:focus,select:focus,textarea:focus{outline:none;border-color:#F55906}button{background:#F55906;color:#fff;border-radius:12px;font-weight:800;font-size:16px;padding:11px 16px}button.alt{background:#F8ECDE;color:#F55906}button.red{background:#D32F2F;color:#fff}button.sm{font-size:14px;padding:6px 12px;border-radius:10px}button:disabled{opacity:.5}.tabs{gap:6px}.tabs button{border-radius:999px;font-size:14px;margin:0;min-width:0;padding:10px 4px;white-space:nowrap;flex:1 1 22%}.tabs button.on{background:#F55906;color:#fff}.tabs button:not(.on){background:#F8ECDE;color:#F55906}.chip{background:#F8ECDE;color:#F55906;font-size:13px;font-weight:700;border-radius:999px;padding:4px 12px}.banner{background:#F55906;color:#fff;border-radius:18px}.banner *,.banner b,.banner small{color:#fff!important}[style*="d4af37"]{background:#F8ECDE!important}footer{color:#6B6B6B;font-size:13px}#toast{background:#1F1F1F;color:#fff;border-radius:14px;font-size:15px}.ov{background:rgba(0,0,0,.55)}img.food{border-radius:12px}.bkb{background:#fff!important;color:#000!important;font-weight:900;font-size:17px;border:1.5px solid #E0E0E0;border-radius:999px;padding:10px 22px;box-shadow:0 2px 8px rgba(0,0,0,.12)}';document.head.appendChild(s)})();</script><script>window.__LA=Date.now();var _l=load;load=async function(){await _l.apply(this,arguments);window.__LA=Date.now()};
window.__CFG={role:'cour',first:1,tasks:function(){return ORD.filter(function(o){return (o.status=='ready'||o.status=='accepted')&&!o.courier_id&&!HID.includes(o.id)}).map(function(o){return {key:'c'+o.id+':'+(o.rel_n||0),t0:window.__LA-(o.avail_age||0)*1000,what:'أوردر #'+o.id+' من '+(o.rest_name||'')+' متاح',tail:'لسه مستني طيار'}})},refresh:function(){load().then(render)}};</script><script>(function(){
var CFG=window.__CFG,ROLE=CFG.role,au=new Audio('/snd-HV2.mp3'),unl=false,q=0,lock=false;au.preload='auto';
window.beep=function(){};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function hm(ts,sec){try{return new Date(ts*1000).toLocaleTimeString('en-GB',{timeZone:'Africa/Cairo',hour:'2-digit',minute:'2-digit',second:sec?'2-digit':undefined})}catch(e){return new Date(ts*1000).toTimeString().slice(0,sec?8:5)}}
var st=document.createElement('style');st.textContent='.ln{font-weight:900;font-size:16px;margin:8px 0 4px;color:#1F1F1F}.nd{background:#F8ECDE;color:#B33F00;font-weight:800;border-radius:12px;padding:8px 12px;margin:6px 0}.stg{display:flex;align-items:center;margin:8px 4px 2px}.stg i{width:14px;height:14px;border-radius:50%;background:#DDD;display:block}.stg i.d{background:#F55906}.stg i.c{background:#F55906;box-shadow:0 0 0 4px #FBD3BC}.stg u{flex:1;height:3px;background:#DDD}.stg u.d{background:#F55906}.stl{display:flex;justify-content:space-between;font-size:11px;color:#6B6B6B;margin-bottom:6px}.tlw summary{color:#F55906;font-weight:800;margin:6px 0;cursor:pointer}.tlw div.ev{padding:4px 12px 4px 0;border-right:3px solid #F8ECDE;font-size:13px}.tlw div.ev.x{border-right-color:#D32F2F}.tlw time{color:#6B6B6B;margin-left:8px}';document.head.appendChild(st);
window.OUI={esc:esc,hm:hm,
 line:function(o){return '<div class=ln>'+esc(o.line||'')+'</div>'+(o.need?'<div class=nd>👉 '+esc(o.need)+'</div>':'')},
 stage:function(o){if(o.stage==null||o.stage<0)return '';var L=['طلب','قبول','جاهز','طيار','تسليم'],h='<div class=stg>';for(var i=0;i<5;i++){h+=(i?'<u class="'+(i<=o.stage?'d':'')+'"></u>':'')+'<i class="'+(i<o.stage||o.stage==4?'d':i==o.stage?'c':'')+'"></i>'}return h+'</div><div class=stl>'+L.map(function(x){return '<span>'+x+'</span>'}).join('')+'</div>'},
 tl:function(o,open,who){var t=o.tl||[];if(!t.length)return '';return '<details class=tlw'+(open?' open':'')+'><summary>الخط الزمني ('+t.length+')</summary>'+t.map(function(e){var bad=/^(rejected|cancelled|released|failed)$/.test(e.k);return '<div class="ev'+(bad?' x':'')+'"><time>'+hm(e.ts,1)+'</time>'+esc(e.text)+(who&&e.who?' <small>('+esc(e.who)+')</small>':'')+'</div>'}).join('')+'</details>'}};
function unlock(){if(unl)return;unl=true;try{au.muted=true;var p=au.play();var done=function(){au.pause();au.currentTime=0;au.muted=false};if(p&&p.then)p.then(done).catch(function(){unl=false});else done()}catch(e){unl=false}}
document.addEventListener('click',unlock);document.addEventListener('touchstart',unlock);
function play(){q=1;next()}
function next(){if(!q||(!au.paused&&!au.ended))return;q=0;try{au.muted=false;au.currentTime=0;var p=au.play();if(p&&p.then)p.then(function(){lock=false}).catch(function(){lock=true})}catch(e){lock=true}try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}
setInterval(next,700);
window.ALERT={play:play,dis:function(i){var m=MSG[i];if(!m)return;if(m.task){var t=T[m.key];if(t)t.d=t.s}else m.until=0;m.hide=1;draw()}};
var box=document.createElement('div');box.id='alb';box.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99999;direction:rtl;pointer-events:none';
var MSG=[];
function line(c,t,i){return '<div onclick="ALERT.dis('+i+')" style="pointer-events:auto;background:'+c+';color:#fff;font-weight:900;font-size:17px;padding:11px 14px;border-bottom:2px solid #fff;text-align:center">'+t+'</div>'}
function draw(){if(document.body&&!box.parentNode)document.body.appendChild(box);var now=Date.now(),h='';if(lock)h+='<div onclick="document.getElementById(\'alb\').dispatchEvent(new Event(\'unl\'))" style="pointer-events:auto;background:#1F1F1F;color:#fff;font-weight:900;font-size:17px;padding:12px;text-align:center">🔔 اضغط هنا عشان يشتغل صوت التنبيه</div>';MSG=MSG.filter(function(m){return !m.hide&&(m.keep||m.until>now)});MSG.slice(-2).forEach(function(m){h+=line(m.c,m.t,MSG.indexOf(m))});box.innerHTML=h}
box.addEventListener('unl',function(){unlock();lock=false;play();draw()});
window.__refresh=function(){try{CFG.refresh&&CFG.refresh()}catch(e){}};
/* ---- escalation 2/5/10 min for tasks that need an action ---- */
var KEY='al3_'+ROLE;function ld(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return{}}}
var T=ld(),inited=false;
function tick(){var ts;try{ts=CFG.tasks()}catch(e){return}if(!ts)return;var now=Date.now(),set={},bump=false,fresh=false;MSG=MSG.filter(function(m){return!m.task});
 ts.forEach(function(x){set[x.key]=1;var t=T[x.key];if(!t){t={t0:x.t0,s:0};T[x.key]=t;if(!inited&&CFG.first&&x.t0>now-120000){fresh=true;t.f=now}}
  var el=(now-t.t0)/1000,s=el>=600?3:el>=300?2:el>=120?1:0;if(s>t.s){t.s=s;bump=true}
  if(t.s==3){if(t.d!==t.s)MSG.push({task:1,key:x.key,keep:1,c:'#B00020',t:'⚠️ تحذير: '+esc(x.what)+' '+esc(x.tail)+' من أكتر من 10 دقايق'})}
  else if(t.s>=1){if(t.d!==t.s)MSG.push({task:1,key:x.key,keep:1,c:'#F55906',t:'⏰ تذكير: '+esc(x.what)+' '+esc(x.tail)})}
  else if(t.f&&now-t.f<12000)MSG.push({task:1,until:t.f+12000,c:'#F55906',t:'🔔 '+esc(x.what)})});
 for(var k in T)if(!set[k])delete T[k];
 try{localStorage.setItem(KEY,JSON.stringify(T))}catch(e){}
 inited=true;if(bump||fresh)play();draw()}
setInterval(tick,2000);setTimeout(tick,1500);
/* ---- instant events: long-poll (server holds the request up to 20s and answers the moment something happens) ---- */
var since=-1,fails=0;
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
async function loop(){while(true){if(document.hidden||typeof TOKEN==='undefined'||!TOKEN){await sleep(1500);continue}
 try{var ac=new AbortController(),to=setTimeout(function(){ac.abort()},30000);var r=await fetch('/api/events?since='+since+(since>=0?'&wait=20':''),{headers:{'X-Token':TOKEN},signal:ac.signal});clearTimeout(to);
  if(r.status==401){await sleep(5000);continue}var j=await r.json();if(since<0){since=j.last;continue}since=j.last;fails=0;
  if(j.events&&j.events.length){var snd=false,now=Date.now();j.events.forEach(function(e){MSG.push({until:now+12000,c:e.warn?'#B00020':'#F55906',t:'🔔 '+esc(e.text)+(e.need?'<br><small style="color:#fff;opacity:.92">👉 '+esc(e.need)+'</small>':'')});if(e.snd)snd=true});if(snd)play();draw();window.__refresh()}
 }catch(e){fails++;await sleep(Math.min(3000*fails,10000))}}}
loop();document.addEventListener('visibilitychange',function(){if(!document.hidden){window.__refresh()}});
})();
</script></body></html>
