<!doctype html><html lang=ar><head><meta charset=utf-8></head><body>
<script>const ROLE='courier',TITLE='3mac - الطيار';</script>
<script src=/common.js></script>
<script>
let HID=JSON.parse(localStorage.getItem('hid3')||'[]');let tab='orders',ORD=[],REC=null,seen=null,FAILID=0;
const FR=['العميل مردش','العنوان غلط','العميل رفض الاستلام','مشكلة في الأوردر'];
async function load(){const [o,r]=await Promise.all([api('orders'),api('my/record')]);if(o){ORD=o;const rd=o.filter(x=>x.status=='ready'||x.status=='accepted').map(x=>x.id);if(seen===null){seen=new Set(rd);if(rd.length)beep(2)}else{const f=rd.filter(i=>!seen.has(i));f.forEach(i=>seen.add(i));if(f.length){beep(3);toast('أوردر جاهز!')}}}if(r)REC=r}
function oCard(o){const mine=o.status=='picked';const items=o.items.map(i=>i.qty+' × '+esc(i.name)).join('، ');
 let h=`<div class="card ${o.status!='picked'?'new':''}"><div class=row><b>${esc(o.rest_name)} #${o.id}</b><span class=st>${esc(o.status_ar)}</span></div><div>${items}</div><div class=row><span>تحصّل كاش:</span><b>${money(o.total)}</b></div><small>رسوم التوصيل: ${money(o.fee)}</small>`;
 if(o.status=='ready'||o.status=='accepted')h+=`<br><button onclick="take(${o.id})">قبول</button><button class="red" onclick="rej(${o.id})">رفض</button>`;
 if(mine&&!o.collected_at){h+=!o.ready_at?'<div class=banner>جاري التجهيز، روح المطعم</div>':`<div class=banner>الأوردر جاهز</div><button onclick="collect(${o.id})">تم الاستلام</button>`}
 else if(mine){h+=`<div style="margin-top:6px"><b>${esc(o.name)}</b><br>${esc(o.address)}${o.note?'<br><small>📝 '+esc(o.note)+'</small>':''}</div>
  <button data-u="tel:${esc(String(o.phone).replace(/[^0-9+]/g,''))}" onclick="openExt(this.dataset.u)">📞 اتصل بالعميل ${esc(o.phone)}</button>
  <button class=alt data-u="${o.lat!=null&&o.lng!=null?'https://www.google.com/maps/search/?api=1&query='+o.lat+','+o.lng:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(o.address)}" onclick="openExt(this.dataset.u)">🗺️ افتح الخريطة</button>
  <br>${FAILID==o.id?'<div>سبب تعذر التوصيل:</div>'+FR.map((r,i)=>`<button class=red onclick="fail(${o.id},${i})">${r}</button>`).join('')+'<button class=alt onclick="FAILID=0;render()">رجوع</button>':`<button onclick="deliver(${o.id})">✔ تم التوصيل</button><button class="red alt" onclick="FAILID=${o.id};render()">تعذر التوصيل</button>`}</div>`}
 return h+'</div>'}
function openExt(u){try{if(window.Android&&Android.openUrl){Android.openUrl(u)}else{location.href=u}}catch(e){toast('مقدرتش أفتح الرابط')}}
function rej(id){HID.push(id);localStorage.setItem('hid3',JSON.stringify(HID.slice(-100)));render()}
async function take(id){const r=await api('order_action',{id,action:'take'});if(r)toast('الأوردر معاك');await load();render()}
async function collect(id){const r=await api('order_action',{id,action:'collect'});if(r)toast('تمام، استلمت الأكل');await load();render()}
async function deliver(id){const r=await api('order_action',{id,action:'deliver'});if(r)toast('تم التسليم ✔');await load();render()}
async function fail(id,i){const r=await api('order_action',{id,action:'fail',reason:FR[i]});FAILID=0;if(r)toast('تم التسجيل');await load();render()}
function render(){let h='<div class=tabs><button class="'+(tab=='orders'?'on':'')+'" onclick="tab=\'orders\';render()">الأوردرات</button><button class="'+(tab=='rec'?'on':'')+'" onclick="tab=\'rec\';render()">سجل النهاردة</button></div>';
 if(tab=='orders'){const mine=ORD.filter(o=>o.status=='picked'),rd=ORD.filter(o=>(o.status=='ready'||o.status=='accepted')&&!HID.includes(o.id));
  h+=(mine.length?'<h3>معايا</h3>'+mine.map(oCard).join(''):'')+'<h3>أوردرات جديدة</h3>'+(rd.length?rd.map(oCard).join(''):'<div class=card>مفيش أوردرات متاحة دلوقتي</div>')}
 else if(REC){h+=`<div class=card><h3>سجل النهاردة</h3><div class=row><span>اتسلّم</span><b>${REC.delivered}</b></div><div class=row><span>تعذر تسليمه</span><b>${REC.failed}</b></div><div class=row><span>إجمالي الكاش اللي اتحصّل</span><b>${money(REC.cash)}</b></div><div class=row><span>منه رسوم توصيل</span><b>${money(REC.fees)}</b></div><small>ده سجل بس للمتابعة.</small></div>`+REC.orders.map(o=>`<div class="card row"><span>#${o.id}</span><span>${money(o.total)}</span></div>`).join('')}
 const sc=window.scrollY;$('#app').innerHTML=h;window.scrollTo(0,sc)}
start(()=>{watch(async()=>{await load();render()},4000)});
</script><script>(function(){var s=document.createElement('style');s.id='th2';s.textContent=':root,[data-theme=dark],[data-theme=light]{--bg:#fff;--card:#fff;--fg:#1F1F1F;--mut:#6B6B6B;--gold:#F55906;--inp:#fff;--btn2:#F8ECDE}html,body{background:#fff!important;color:#1F1F1F;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-size:16px}header{background:#F55906;color:#fff;border-bottom:0;padding:14px 16px;box-shadow:0 2px 10px rgba(245,89,6,.25)}header b{color:#fff;font-size:20px;font-weight:800}header button,header button.alt{background:rgba(255,255,255,.22);color:#fff;border-radius:999px;font-size:14px;padding:7px 12px}#thm{display:none}#app{padding:12px}.card{background:#fff;color:#1F1F1F;border:1px solid #EEE;border-radius:18px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}.card.new,.new{border:2px solid #F55906}h2,h3{color:#1F1F1F;font-size:18px;font-weight:800;margin:8px 0}h2{font-size:20px}small,.mut{color:#6B6B6B;font-size:13px}a{color:#F55906}.st{color:#F55906;font-weight:800}input,select,textarea{background:#fff;color:#1F1F1F;border:1.5px solid #E5E5E5;border-radius:12px;padding:11px 12px;font-size:16px}input:focus,select:focus,textarea:focus{outline:none;border-color:#F55906}button{background:#F55906;color:#fff;border-radius:12px;font-weight:800;font-size:16px;padding:11px 16px}button.alt{background:#F8ECDE;color:#F55906}button.red{background:#D32F2F;color:#fff}button.sm{font-size:14px;padding:6px 12px;border-radius:10px}button:disabled{opacity:.5}.tabs{gap:6px}.tabs button{border-radius:999px;font-size:14px;margin:0;min-width:0;padding:10px 4px;white-space:nowrap;flex:1 1 22%}.tabs button.on{background:#F55906;color:#fff}.tabs button:not(.on){background:#F8ECDE;color:#F55906}.chip{background:#F8ECDE;color:#F55906;font-size:13px;font-weight:700;border-radius:999px;padding:4px 12px}.banner{background:#F55906;color:#fff;border-radius:18px}.banner *,.banner b,.banner small{color:#fff!important}[style*="d4af37"]{background:#F8ECDE!important}footer{color:#6B6B6B;font-size:13px}#toast{background:#1F1F1F;color:#fff;border-radius:14px;font-size:15px}.ov{background:rgba(0,0,0,.55)}img.food{border-radius:12px}';document.head.appendChild(s)})();</script></body></html>
