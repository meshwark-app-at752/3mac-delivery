<!doctype html><html lang=ar><head><meta charset=utf-8></head><body>
<script>const ROLE='admin',TITLE='3mac - الإدارة';</script>
<script src=/common.js></script>
<script>
let tab='orders',BOARD=[],BF='prob',BQ='',BR='',OPEN=0,CANX=0,ORD=[],REP=null,USERS=[],DISCS=[],NEWCODE='',FIL='today',SETV=null,LASTUSERS='';
const STS=[['today','النهاردة'],['new','جديد'],['accepted','اتقبل'],['ready','جاهز'],['picked','في الطريق'],['delivered','اتسلم'],['rejected','مرفوض'],['cancelled','ملغي'],['failed','تعذر']];
async function loadTab(){
 if(tab=='orders'){await loadBoard()}
 else if(tab=='rep'){const r=await api('admin/report');if(r)REP=r}
 else if(tab=='users'){const r=await api('admin/users');if(r)USERS=r}
 else if(tab=='disc'){const r=await api('admin/discounts');if(r)DISCS=r}
 else if(tab=='set'){const r=await fetch('/api/settings').then(r=>r.json());SETV=r}}
async function loadBoard(){const r=await api('orders?view=board');if(r){BOARD=r;window.__LA=Date.now()}}
const CL=['#F55906','#D32F2F'];
function probs(o){const P=[],pt=(BOARD[0]&&BOARD[0].pt)||{tpl:{},stuck:120,held:2400},el=(Date.now()-(window.__LA||Date.now()))/1000,mn=a=>Math.max(1,Math.floor((a+el)/60));
 if(o.status=='new'&&o.created_age>pt.stuck)P.push({k:'new',t:pt.tpl.new.replace('{m}',mn(o.created_age)),snd:0});
 if((o.status=='ready'||o.status=='accepted')&&!o.courier_id&&o.avail_age!=null&&o.avail_age>pt.stuck)P.push({k:'nocourier',t:(o.rel_n?pt.tpl.released:pt.tpl.nocourier).replace('{m}',mn(o.avail_age)),snd:o.rel_n});
 if(o.status=='failed')P.push({k:'failed',t:pt.tpl.failed.replace('{note}',o.fail_reason||''),snd:1});
 if(o.status=='picked'&&o.held_age!=null&&o.held_age>pt.held)P.push({k:'held',t:pt.tpl.held.replace('{m}',mn(o.held_age)),snd:0});
 return P}
function isClosed(o){return ['delivered','rejected','cancelled','failed'].includes(o.status)}
function bcard(o){const P=probs(o),op=OPEN==o.id,cl=isClosed(o),col=P.length?'#D32F2F':cl?'#9E9E9E':'#F55906';
 let h=`<div class=card style="border-right:6px solid ${col}"><div class=row onclick="OPEN=${op?0:o.id};render()" style="cursor:pointer"><b>${esc(o.rest_name)} #${o.id}</b><small>${timeAgo(o.created)}</small></div>
 <div onclick="OPEN=${op?0:o.id};render()" style="cursor:pointer">${OUI.line(o)}</div>`;
 if(P.length)h+=P.map(p=>'<div style="background:#FDE7E7;color:#B00020;font-weight:900;border-radius:12px;padding:8px 12px;margin:6px 0">⚠️ '+esc(p.t)+'</div>').join('');
 h+=OUI.stage(o);
 if(op){h+=`<div style="margin-top:8px"><small>${esc(o.name||'')} · ${esc(o.phone||'')}</small><br><small>${esc(o.address||'')}${o.note?' · 📝 '+esc(o.note):''}</small><br>${o.items.map(i=>i.qty+' × '+esc(i.name)).join('، ')}
 <div class=row><span>الإجمالي</span><b>${money(o.total)}</b></div><small>أكل ${money(o.subtotal)} + توصيل ${money(o.fee)}${o.discount?' - خصم '+money(o.discount):''}</small>
 ${o.courier_name?'<br><small>الطيار: '+esc(o.courier_name)+'</small>':''}${o.reject_reason?'<br><small>سبب الرفض/الإلغاء: '+esc(o.reject_reason)+'</small>':''}${o.fail_reason?'<br><small>سبب التعذر: '+esc(o.fail_reason)+'</small>':''}</div>`+OUI.tl(o,true,true);
  if(o.phone)h+=`<button class="sm alt" data-u="tel:${esc(String(o.phone).replace(/[^0-9+]/g,''))}" onclick="openExt(this.dataset.u)">📞 العميل</button>`;
  if(!cl)h+=CANX==o.id?'<div>سبب الإلغاء:</div>'+CR.map((r,i)=>`<button class=red onclick="cancelO(${o.id},${i})">${r}</button>`).join('')+`<button class="alt bkb" onclick="CANX=0;render()">رجوع</button>`:`<button class="red sm" onclick="CANX=${o.id};render()">إلغاء الطلب</button>`}
 return h+'</div>'}
const CR=['العميل طلب الإلغاء','المطعم مش قادر','مفيش طيار','طلب غلط / تجريبي'];
function openExt(u){try{if(window.Android&&Android.openUrl){Android.openUrl(u)}else{location.href=u}}catch(e){toast('مقدرتش أفتح الرابط')}}
function boardH(){const FL=[['prob','محتاج تدخل'],['act','شغالة'],['today','النهاردة'],['done','اتسلمت'],['bad','ملغية/فاشلة']];
 const rs=[...new Set(BOARD.map(o=>o.rest_name))];
 let L=BOARD.filter(o=>{if(BR&&o.rest_name!=BR)return false;if(BQ){const q=BQ.trim();if(!(('#'+o.id).includes(q)||String(o.id)==q||(o.phone||'').includes(q)||(o.name||'').includes(q)))return false}
  return BF=='prob'?probs(o).length>0:BF=='act'?!isClosed(o):BF=='done'?o.status=='delivered':BF=='bad'?['rejected','cancelled','failed'].includes(o.status):true});
 L.sort((a,b)=>{const pa=probs(a).length>0,pb=probs(b).length>0;if(pa!=pb)return pa?-1:1;const ca=isClosed(a),cb=isClosed(b);if(ca!=cb)return ca?1:-1;return ca?b.id-a.id:a.id-b.id});
 const np=BOARD.filter(o=>probs(o).length).length;
 return '<div class=tabs style="margin-top:6px;flex-wrap:wrap">'+FL.map(f=>`<button class="sm ${BF==f[0]?'on':''}" style="font-size:13px;padding:8px 6px" onclick="BF='${f[0]}';render()">${f[1]}${f[0]=='prob'&&np?' '+np:''}</button>`).join('')+'</div>'
 +`<div class=row><input id=bq placeholder="ابحث برقم الطلب أو الاسم أو التليفون" value="${esc(BQ)}" oninput="BQ=this.value;clearTimeout(window.__bt);window.__bt=setTimeout(render,500)" style="flex:1"><select id=br onchange="BR=this.value;render()" style="width:auto"><option value="">كل المطاعم</option>${rs.map(r=>`<option${BR==r?' selected':''}>${esc(r)}</option>`).join('')}</select></div>`

function tabsH(){const t=[['orders','الطلبات'],['rep','التقارير'],['users','المستخدمين'],['disc','الخصومات'],['set','الإعدادات']];return '<div class=tabs>'+t.map(x=>`<button class="${tab==x[0]?'on':''}" onclick="sw('${x[0]}')">${x[1]}</button>`).join('')+'</div>'}
async function sw(t){tab=t;await loadTab();render()}
function oCard(o){return `<div class=card><div class=row><b>${esc(o.rest_name)} #${o.id}</b></div><small>${esc(o.name)} · ${esc(o.phone)} · ${timeAgo(o.created)}</small><br>${o.items.map(i=>i.qty+' × '+esc(i.name)).join('، ')}<br><small>${esc(o.address)}${o.note?' · 📝 '+esc(o.note):''}</small>

window.OUI={esc:esc,hm:hm,
 line:function(o){return '<div class=ln>'+esc(o.line||'')+'</div>'+(o.need?'<div class=nd>👉 '+esc(o.need)+'</div>':'')},
 stage:function(o){if(o.stage==null||o.stage<0)return '';var L=['طلب','قبول','جاهز','طيار','تسليم'],h='<div class=stg>';for(var i=0;i<5;i++){h+=(i?'<u class="'+(i<=o.stage?'d':'')+'"></u>':'')+'<i class="'+(i<o.stage||o.stage==4?'d':i==o.stage?'c':'')+'"></i>'}return h+'</div><div class=stl>'+L.map(function(x){return '<span>'+x+'</span>'}).join('')+'</div>'},
 tl:function(o,open,who){var t=o.tl||[];if(!t.length)return '';return '<details class=tlw'+(open?' open':'')+'><summary>الخط الزمني ('+t.length+')</summary>'+t.map(function(e){var bad=/^(rejected|cancelled|released|failed)$/.test(e.k);return '<div class="ev'+(bad?' x':'')+'"><time>'+hm(e.ts,1)+'</time>'+esc(e.text)+(who&&e.who?' <small>('+esc(e.who)+')</small>':'')+'</div>'}).join('')+'</details>'}};
function unlock(){if(unl)return;unl=true;try{au.muted=true;var p=au.play();var done=function(){au.pause();au.currentTime=0;au.muted=false};if(p&&p.then)p.then(done).catch(function(){unl=false});else done()}catch(e){unl=false}}
document.addEventListener('click',unlock);document.addEventListener('touchstart',unlock);
function play(){q=1;next()}
function next(){if(!q||(!au.paused&&!au.ended))return;q=0;try{au.muted=false;au.currentTime=0;var p=au.play();if(p&&p.then)p.then(function(){lock=false}).catch(function(){lock=true})}catch(e){lock=true}try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}
setInterval(next,700);
window.ALERT={play:play,dis:function(i){var m=MSG[i];if(!m)return;if(m.task){var t=T[m.key];if(t)t.d=t.s}else m.until=0;m.hide=1;draw()}};
var box=document.createElement('div');box.id='alb';box.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99999;direction:rtl;pointer-events:none';
var MSG=[];
function line(c,t,i){return '<div onclick="ALERT.dis('+i+')" style="pointer-events:auto;background:'+c+';color:#fff;font-weight:900;font-size:17px;padding:11px 14px;border-bottom:2px solid #fff;text-align:center">'+t+'</div>'}
function draw(){if(document.body&&!box.parentNode)document.body.appendChild(box);var now=Date.now(),h='';if(lock)h+='<div onclick="document.getElementById(\'alb\').dispatchEvent(new Event(\'unl\'))" style="pointer-events:auto;background:#1F1F1F;color:#fff;font-weight:900;font-size:17px;padding:12px;text-align:center">🔔 اضغط هنا عشان يشتغل صوت التنبيه</div>';MSG=MSG.filter(function(m){return !m.hide&&(m.keep||m.until>now)});MSG.slice(-2).forEach(function(m){h+=line(m.c,m.t,MSG.indexOf(m))});box.innerHTML=h}
box.addEventListener('unl',function(){unlock();lock=false;play();draw()});
window.__refresh=function(){try{CFG.refresh&&CFG.refresh()}catch(e){}};
/* ---- escalation 2/5/10 min for tasks that need an action ---- */
var KEY='al3_'+ROLE;function ld(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return{}}}
var T=ld(),inited=false;
function tick(){var ts;try{ts=CFG.tasks()}catch(e){return}if(!ts)return;var now=Date.now(),set={},bump=false,fresh=false;MSG=MSG.filter(function(m){return!m.task});
 ts.forEach(function(x){set[x.key]=1;var t=T[x.key];if(!t){t={t0:x.t0,s:0};T[x.key]=t;if(!inited&&CFG.first&&x.t0>now-120000){fresh=true;t.f=now}}
  var el=(now-t.t0)/1000,s=el>=600?3:el>=300?2:el>=120?1:0;if(s>t.s){t.s=s;bump=true}
  if(t.s==3){if(t.d!==t.s)MSG.push({task:1,key:x.key,keep:1,c:'#B00020',t:'⚠️ تحذير: '+esc(x.what)+' '+esc(x.tail)+' من أكتر من 10 دقايق'})}
  else if(t.s>=1){if(t.d!==t.s)MSG.push({task:1,key:x.key,keep:1,c:'#F55906',t:'⏰ تذكير: '+esc(x.what)+' '+esc(x.tail)})}
  else if(t.f&&now-t.f<12000)MSG.push({task:1,until:t.f+12000,c:'#F55906',t:'🔔 '+esc(x.what)})});
 for(var k in T)if(!set[k])delete T[k];
 try{localStorage.setItem(KEY,JSON.stringify(T))}catch(e){}
 inited=true;if(bump||fresh)play();draw()}
setInterval(tick,2000);setTimeout(tick,1500);
/* ---- instant events: long-poll (server holds the request up to 20s and answers the moment something happens) ---- */
var since=-1,fails=0;
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
async function loop(){while(true){if(document.hidden||typeof TOKEN==='undefined'||!TOKEN){await sleep(1500);continue}
 try{var ac=new AbortController(),to=setTimeout(function(){ac.abort()},30000);var r=await fetch('/api/events?since='+since+(since>=0?'&wait=20':''),{headers:{'X-Token':TOKEN},signal:ac.signal});clearTimeout(to);
  if(r.status==401){await sleep(5000);continue}var j=await r.json();if(since<0){since=j.last;continue}since=j.last;fails=0;
  if(j.events&&j.events.length){var snd=false,now=Date.now();j.events.forEach(function(e){MSG.push({until:now+12000,c:e.warn?'#B00020':'#F55906',t:'🔔 '+esc(e.text)+(e.need?'<br><small style="color:#fff;opacity:.92">👉 '+esc(e.need)+'</small>':'')});if(e.snd)snd=true});if(snd)play();draw();window.__refresh()}
 }catch(e){fails++;await sleep(Math.min(3000*fails,10000))}}}
loop();document.addEventListener('visibilitychange',function(){if(!document.hidden){window.__refresh()}});
})();
</script></body></html>
