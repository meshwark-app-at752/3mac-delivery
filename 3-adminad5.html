<!doctype html><html lang=ar><head><meta charset=utf-8></head><body>
<script>const ROLE='admin',TITLE='3mac - الإدارة';</script>
<script src=/common.js></script>
<script>
let tab='orders',ORD=[],REP=null,USERS=[],DISCS=[],NEWCODE='',FIL='today',SETV=null,LASTUSERS='';
const STS=[['today','النهاردة'],['new','جديد'],['accepted','اتقبل'],['ready','جاهز'],['picked','في الطريق'],['delivered','اتسلم'],['rejected','مرفوض'],['cancelled','ملغي'],['failed','تعذر']];
async function loadTab(){
 if(tab=='orders'){const r=await api('orders'+(FIL=='today'?'?day=today':'?status='+FIL));if(r)ORD=r}
 else if(tab=='rep'){const r=await api('admin/report');if(r)REP=r}
 else if(tab=='users'){const r=await api('admin/users');if(r)USERS=r}
 else if(tab=='disc'){const r=await api('admin/discounts');if(r)DISCS=r}
 else if(tab=='set'){const r=await fetch('/api/settings').then(r=>r.json());SETV=r}}
function tabsH(){const t=[['orders','الطلبات'],['rep','التقارير'],['users','المستخدمين'],['disc','الخصومات'],['set','الإعدادات']];return '<div class=tabs>'+t.map(x=>`<button class="${tab==x[0]?'on':''}" onclick="sw('${x[0]}')">${x[1]}</button>`).join('')+'</div>'}
async function sw(t){tab=t;await loadTab();render()}
function oCard(o){return `<div class=card><div class=row><b>${esc(o.rest_name)} #${o.id}</b><span class=st>${esc(o.status_ar)}</span></div><small>${esc(o.name)} · ${esc(o.phone)} · ${timeAgo(o.created)}</small><br>${o.items.map(i=>i.qty+' × '+esc(i.name)).join('، ')}<br><small>${esc(o.address)}${o.note?' · 📝 '+esc(o.note):''}</small>
 <div class=row><span>الإجمالي</span><b>${money(o.total)}</b></div><small>أكل ${money(o.subtotal)} + توصيل ${money(o.fee)}${o.discount?' - خصم '+money(o.discount)+' ('+esc(o.discount_code)+' على '+(o.discount_by=='owner'?'المالك':'المطعم')+')':''}</small>
 ${o.reject_reason?'<br><small>سبب الرفض: '+esc(o.reject_reason)+'</small>':''}${o.fail_reason?'<br><small>سبب التعذر: '+esc(o.fail_reason)+'</small>':''}
 ${['new','accepted','ready','picked'].includes(o.status)?`<br><button class="red sm" onclick="cancelO(${o.id})">إلغاء الطلب</button>`:''}</div>`}
async function cancelO(id){const r=await api('order_action',{id,action:'cancel'});if(r){toast('تم الإلغاء');await loadTab();render()}}
function box(t,s){return `<div class=card><h3>${t}</h3><div class=row><span>عدد الطلبات المسلّمة</span><b>${s.count}</b></div><div class=row><span>مبيعات الأكل</span><b>${money(s.subtotal)}</b></div><div class=row><span>رسوم التوصيل</span><b>${money(s.fees)}</b></div><div class=row><span>خصومات على المالك</span><b>- ${money(s.discount_owner)}</b></div><div class=row><span>خصومات على المطاعم</span><b>${money(s.discount_rest)}</b></div><div class=row><b>أرباحك (توصيل - خصم المالك)</b><b>${money(s.fees-s.discount_owner)}</b></div><div class=row><span>إجمالي الكاش المتحصّل</span><b>${money(s.total)}</b></div></div>`}
const SN={new:'جديد',accepted:'اتقبل',ready:'جاهز',picked:'في الطريق',delivered:'اتسلم',rejected:'مرفوض',cancelled:'ملغي',failed:'تعذر'};
function repH(){if(!REP)return '';let h=box('النهاردة',REP.today)+'<div class=card><b>عدد طلبات النهاردة حسب الحالة</b><br>'+(Object.keys(REP.status_today).length?Object.entries(REP.status_today).map(([k,v])=>`<span class=chip>${SN[k]||k}: ${v}</span>`).join(''):'<small>لسه مفيش</small>')+'</div>';
 h+=box('آخر 7 أيام',REP.week)+box('الكل',REP.all);
 h+='<div class=card><h3>المطاعم (النهاردة)</h3>'+REP.restaurants.map(r=>`<div class=row><span>${esc(r.name)}</span><span>${r.delivered} طلب · ${money(r.subtotal)}</span></div>`).join('')+'</div>';
 h+='<div class=card><h3>الطيارين (النهاردة)</h3>'+REP.couriers.map(r=>`<div class=row><span>${esc(r.name)}</span><span>${r.delivered} اتسلم · ${r.failed} تعذر · كاش ${money(r.cash)}</span></div>`).join('')+'</div>';
 return h}
const CATN={rest:'مطاعم',groc:'بقالة',pharm:'صيدليات',shop:'المتاجر'};function catSel(id,v){return `<select id=${id} style="width:auto">${Object.keys(CATN).map(k=>`<option value=${k}${(v||'rest')==k?' selected':''}>${CATN[k]}</option>`).join('')}</select>`}
function userCard(u){const r=u.role=='restaurant';return `<div class=card><div class=row><b>${esc(u.name)}</b><span class=chip>${r?(CATN[u.cat||'rest']||'مطعم'):'طيار'}${u.active?'':' · موقوف'}</span></div><small>الكود: <b>${esc(u.code)}</b></small>
 ${r?`<div class=row style="flex-wrap:wrap">${u.hasp?`<img src="/rpic/${u.rid}?v=${Date.now()}" style="width:90px;height:50px;object-fit:cover;border-radius:8px">`:'<small>مفيش صورة</small>'}<button class="sm alt" onclick="document.getElementById('rp${u.id}').click()">📷 صورة المطعم</button>${u.hasp?`<button class="sm red" onclick="rpDel(${u.rid})">مسح الصورة</button>`:''}<input type=file accept="image/*" id=rp${u.id} style="display:none" onchange="rpUp(${u.rid},this)"></div>${u.promo?`<small>خصم المطعم: ${esc(u.promo)}</small>`:''}<div class=row style="flex-wrap:wrap"><small>القسم</small>${catSel('ct'+u.id,u.cat)}<small>التوصيل</small><input id=fee${u.id} value="${u.fee}" inputmode=decimal style="width:80px"><label><input type=checkbox id=ft${u.id} style="width:auto" ${u.featured?'checked':''}> مميز</label><button class="sm" onclick="setR(${u.rid},${u.id})">حفظ</button></div>`:''}
 <button class="sm ${u.active?'red':''}" onclick="utog(${u.id})">${u.active?'إيقاف':'إعادة تفعيل'}</button></div>`}
async function rpUp(id,inp){const f=inp.files[0];if(!f)return;toast('بجهز الصورة...');try{const d=await resizeImage(f,640);const r=await api('admin/rest_photo',{id,data:d});if(r){toast('تم رفع الصورة');await loadTab();render()}}catch(e){toast('الصورة مش مناسبة')}}
async function rpDel(id){if(!confirm('تمسح صورة المطعم؟'))return;const r=await api('admin/rest_photo_delete',{id});if(r){toast('تم المسح');await loadTab();render()}}
async function setR(rid,uid){const r=await api('admin/restaurant_set',{id:rid,fee:$('#fee'+uid).value,featured:$('#ft'+uid).checked,cat:$('#ct'+uid).value});if(r){toast('تم الحفظ');await loadTab();render()}}
async function utog(id){const r=await api('admin/user_toggle',{id});if(r){await loadTab();render()}}
async function addR(){const r=await api('admin/add_restaurant',{name:$('#rn').value,fee:$('#rf').value||0,cat:$('#rc').value});if(r){NEWCODE='كود الشريك الجديد: '+r.code;await loadTab();render()}}
async function addC(){const r=await api('admin/add_courier',{name:$('#cn').value});if(r){NEWCODE='كود الطيار الجديد: '+r.code;await loadTab();render()}}
async function addD(){const r=await api('admin/discount_add',{code:$('#dcode').value,amount:$('#damt').value,borne_by:$('#dby').value,max_uses:$('#dmax').value||0});if(r){toast('تم إضافة الكود');await loadTab();render()}}
async function dtog(id){await api('admin/discount_toggle',{id});await loadTab();render()}
async function saveSet(){const r=await api('admin/settings',{banner:$('#sb').value,welcome:$('#sw').value,contact_phone:$('#sp').value});if(r){toast('تم الحفظ');await loadTab();render()}}
async function backup(){const r=await api('admin/backup_link');if(r){toast('بيبدأ التحميل...');location.href=r.url}}
function render(){let h=tabsH();
 if(tab=='orders'){h+='<div class=tabs style="margin-top:6px">'+STS.map(s=>`<button class="sm ${FIL==s[0]?'on':''}" onclick="FIL='${s[0]}';sw('orders')">${s[1]}</button>`).join('')+'</div>'+(ORD.length?ORD.map(oCard).join(''):'<div class=card>مفيش طلبات</div>')}
 else if(tab=='rep')h+=repH();
 else if(tab=='users'){h+=(NEWCODE?`<div class=banner>${esc(NEWCODE)}<br><small style="color:#000">اكتبه وابعته له</small></div>`:'')+`<div class=card><b>إضافة شريك (مطعم / بقالة / صيدلية / متجر)</b><input id=rn placeholder="اسم الشريك">${catSel('rc','rest')}<input id=rf placeholder="رسوم التوصيل" inputmode=decimal><button onclick="addR()">إضافة شريك</button></div><div class=card><b>إضافة طيار</b><input id=cn placeholder="اسم الطيار"><button onclick="addC()">إضافة طيار</button></div>`+USERS.map(userCard).join('')}
 else if(tab=='disc'){h+=`<div class=card><b>كود خصم جديد</b><input id=dcode placeholder="الكود (مثلا WELCOME10)"><input id=damt placeholder="قيمة الخصم بالجنيه" inputmode=decimal><select id=dby><option value=owner>الخصم على المالك</option><option value=restaurant>الخصم على المطعم</option></select><input id=dmax placeholder="أقصى عدد استخدامات (0 = بلا حد)" inputmode=numeric><button onclick="addD()">إضافة</button></div>`+DISCS.map(d=>`<div class=card><div class=row><b>${esc(d.code)}</b><span>${money(d.amount)} · على ${d.borne_by=='owner'?'المالك':'المطعم'}</span></div><small>استخدم ${d.uses}${d.max_uses?' من '+d.max_uses:''} مرة · ${d.active?'شغال':'موقوف'}</small><br><button class="sm ${d.active?'red':''}" onclick="dtog(${d.id})">${d.active?'إيقاف':'تفعيل'}</button></div>`).join('')}
 else if(tab=='set'&&SETV){h+=`<div class=card><b>إعلان في صفحة العميل (اتركه فاضي للإخفاء)</b><input id=sb maxlength=200 value="${esc(SETV.banner)}"><small>اكتب نص، أو الصق رابط مباشر (https) لصورة متحركة GIF أو لفيديو mp4 وهيشتغل تلقائيا بدون صوت وبتكرار.</small><b>رسالة الترحيب أول مرة</b><textarea id=sw rows=3>${esc(SETV.welcome)}</textarea><b>رقم التواصل</b><input id=sp value="${esc(SETV.contact_phone)}" inputmode=tel><button onclick="saveSet()">حفظ</button></div><div class=card><b>نسخة احتياطية</b><br><small>بتنزل ملف بكل بياناتك.</small><br><button onclick="backup()">⬇ تحميل نسخة احتياطية</button></div>`}
 const sc=window.scrollY;$('#app').innerHTML=h;window.scrollTo(0,sc)}
start(()=>{watch(async()=>{const a=document.activeElement;const typing=a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName);if(tab=='set'||typing)return;await loadTab();render()},5000);loadTab().then(render)});
</script><script>(function(){var s=document.createElement('style');s.id='th2';s.textContent=':root,[data-theme=dark],[data-theme=light]{--bg:#fff;--card:#fff;--fg:#1F1F1F;--mut:#6B6B6B;--gold:#F55906;--inp:#fff;--btn2:#F8ECDE}html,body{background:#fff!important;color:#1F1F1F;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-size:16px}header{background:#F55906;color:#fff;border-bottom:0;padding:14px 16px;box-shadow:0 2px 10px rgba(245,89,6,.25)}header b{color:#fff;font-size:20px;font-weight:800}header button,header button.alt{background:rgba(255,255,255,.22);color:#fff;border-radius:999px;font-size:14px;padding:7px 12px}#thm{display:none}#app{padding:12px}.card{background:#fff;color:#1F1F1F;border:1px solid #EEE;border-radius:18px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}.card.new,.new{border:2px solid #F55906}h2,h3{color:#1F1F1F;font-size:18px;font-weight:800;margin:8px 0}h2{font-size:20px}small,.mut{color:#6B6B6B;font-size:13px}a{color:#F55906}.st{color:#F55906;font-weight:800}input,select,textarea{background:#fff;color:#1F1F1F;border:1.5px solid #E5E5E5;border-radius:12px;padding:11px 12px;font-size:16px}input:focus,select:focus,textarea:focus{outline:none;border-color:#F55906}button{background:#F55906;color:#fff;border-radius:12px;font-weight:800;font-size:16px;padding:11px 16px}button.alt{background:#F8ECDE;color:#F55906}button.red{background:#D32F2F;color:#fff}button.sm{font-size:14px;padding:6px 12px;border-radius:10px}button:disabled{opacity:.5}.tabs{gap:6px}.tabs button{border-radius:999px;font-size:14px;margin:0;min-width:0;padding:10px 4px;white-space:nowrap;flex:1 1 22%}.tabs button.on{background:#F55906;color:#fff}.tabs button:not(.on){background:#F8ECDE;color:#F55906}.chip{background:#F8ECDE;color:#F55906;font-size:13px;font-weight:700;border-radius:999px;padding:4px 12px}.banner{background:#F55906;color:#fff;border-radius:18px}.banner *,.banner b,.banner small{color:#fff!important}[style*="d4af37"]{background:#F8ECDE!important}footer{color:#6B6B6B;font-size:13px}#toast{background:#1F1F1F;color:#fff;border-radius:14px;font-size:15px}.ov{background:rgba(0,0,0,.55)}img.food{border-radius:12px}';document.head.appendChild(s)})();</script><script>window.__ROLE='adm';window.__first=0;window.__tasks=function(){return ORD.filter(function(o){return o.status=='new'}).map(function(o){return {id:o.id,what:'طلب #'+o.id+' ('+(o.rest_name||'')+') ما اتقبلش'}})};(function(){
var au=new Audio('/snd-HV2.mp3'),unl=false,ROLE=window.__ROLE,pend=0,q=0;au.preload='auto';
window.beep=function(){};
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function unlock(){if(unl)return;unl=true;try{au.muted=true;var p=au.play();var done=function(){au.pause();au.currentTime=0;au.muted=false};if(p&&p.then)p.then(done).catch(function(){unl=false});else done()}catch(e){unl=false}}
document.addEventListener('click',unlock);document.addEventListener('touchstart',unlock);
var lock=false;
function play(){q=1;next()}
function next(){if(!q||(!au.paused&&!au.ended))return;q=0;try{au.muted=false;au.currentTime=0;var p=au.play();if(p&&p.then)p.then(function(){lock=false}).catch(function(){lock=true})}catch(e){lock=true}try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}
setInterval(next,700);
var box=document.createElement('div');box.id='alb';box.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99999;direction:rtl;font-family:inherit;pointer-events:none';
function mount(){if(document.body&&!box.parentNode)document.body.appendChild(box)}
var KEY='al_'+ROLE;function ld(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return{}}}
var T=ld(),MSG=[];
function line(c,txt,onclick){return '<div style="pointer-events:auto;background:'+c+';color:#fff;font-weight:900;font-size:18px;padding:12px 14px;border-bottom:2px solid #fff;text-align:center">'+txt+'</div>'}
function draw(){mount();var h='';if(lock)h+='<div onclick="document.getElementById(\'alb\').dispatchEvent(new Event(\'unl\'))" style="pointer-events:auto;background:#1F1F1F;color:#fff;font-weight:900;font-size:17px;padding:12px;text-align:center">🔔 اضغط هنا عشان يشتغل صوت التنبيه</div>';
 var now=Date.now();MSG=MSG.filter(function(m){return m.until>now||m.keep});
 MSG.forEach(function(m){h+=line(m.c,m.t)});box.innerHTML=h}
box.addEventListener('unl',function(){unlock();lock=false;play();draw()});
function tick(){var ts;try{ts=window.__tasks()}catch(e){return}var now=Date.now(),set={},fresh=false,bump=false;MSG=MSG.filter(function(m){return!m.task});
 ts.forEach(function(x){set[x.id]=1;var t=T[x.id];if(!t){t=T[x.id]={t0:now,s:0};if(window.__first)fresh=true;else t.s=-1}
  var el=(now-t.t0)/1000,st=el>=600?3:el>=300?2:el>=120?1:0;
  if(t.s<0&&st==0)st=-1;
  if(st>t.s){t.s=st;bump=true}
  var w=x.what,s=t.s;
  if(s==3)MSG.push({task:1,keep:1,c:'#B00020',t:'⚠️ تحذير: '+esc(w)+' لسه مستني ردك من أكتر من 10 دقايق'});
  else if(s>=1)MSG.push({task:1,keep:1,c:'#F55906',t:'⏰ تذكير: '+esc(w)+' لسه مستني ردك'});
  else if(s==0&&window.__first&&now-t.t0<12000)MSG.push({task:1,until:t.t0+12000,c:'#F55906',t:'🔔 '+esc(w)})});
 for(var id in T)if(!set[id])delete T[id];
 try{localStorage.setItem(KEY,JSON.stringify(T))}catch(e){}
 if(bump||fresh)play();draw()}
setInterval(tick,2000);setTimeout(tick,1200);
if(window.__chg){var prev=null;setInterval(function(){var o;try{o=window.__chg()}catch(e){return}if(!o)return;var m={};o.forEach(function(x){m[x.id]=x.status});if(prev){o.forEach(function(x){if(prev[x.id]!==x.status){play();MSG.push({until:Date.now()+10000,c:'#F55906',t:'🔔 طلبك #'+x.id+': '+esc(x.status_ar||x.status)})}})}prev=m},2000)}
})();
</script></body></html>
