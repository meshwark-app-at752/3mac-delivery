<!doctype html><html lang=ar dir=rtl><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>3mac delivery</title>
<script>const ROLE='restaurant',TITLE='3mac delivery';</script><style></style></head><body><header><span style="display:flex;align-items:center;gap:8px"><img src=logo.png height=36><b style="line-height:1.2">3mac delivery<br><small style="color:#d4af37">المطعم</small></b></span><button class=alt onclick="logout()" style="padding:4px 10px">خروج</button></header><div id=app></div><div id=toast></div>
<script src=common.js></script><script>document.head.insertAdjacentHTML('beforeend',CSS);
let tab='o';
function main(){$('#app').innerHTML='<div class=row><button id=t1>الطلبات</button><button id=t2 class=alt>المنيو</button><button id=t3 class=alt>فتح/قفل</button></div><div id=body></div>';
 $('#t1').onclick=()=>{tab='o';draw()};$('#t2').onclick=()=>{tab='m';draw()};$('#t3').onclick=async()=>{await api('my/toggle',{});draw()};draw();setInterval(()=>{if(tab=='o')draw()},5000)}
let last=0;
async function draw(){const b=$('#body');
 if(tab=='m'){const m=await api('my/menu');if(!m)return;b.innerHTML='<div class=card><input id=in placeholder="اسم الصنف"><input id=ip placeholder="السعر" inputmode=decimal><button onclick=add()>إضافة</button></div>'+m.map(x=>`<div class=card><div class=row><span>${esc(x.name)} - ${x.price} ج ${x.avail?'':'<small>(غير متاح)</small>'}</span><span><button class=alt onclick="tg(${x.id})">متاح/لا</button><button class=red onclick="del(${x.id})">حذف</button></span></div></div>`).join('');return}
 const i=await api('my/info');const o=await api('orders');if(!o)return;
 const n=o.filter(x=>x.status=='new').length;if(n>last)toast('طلب جديد!');last=n;
 b.innerHTML=`<p>المطعم: ${i?(i.is_open?'مفتوح':'مقفول'):''}</p>`+o.map(x=>`<div class=card><div class=row><b>#${x.id} ${esc(x.name)}</b><span class=st>${x.status_ar}</span></div>${x.items.map(i=>esc(i.name)+' ×'+i.qty).join('، ')}<br><b>${x.total} ج</b><br>${x.status=='new'?`<button onclick="act(${x.id},'accept')">قبول</button><button class=red onclick="act(${x.id},'reject')">رفض</button>`:''}${x.status=='accepted'?`<button onclick="act(${x.id},'ready')">جاهز للتوصيل</button>`:''}</div>`).join('')||'<p>لا توجد طلبات</p>'}
async function act(id,action){if(await api('order_action',{id,action}))draw()}
async function add(){if(await api('my/item',{name:$('#in').value,price:$('#ip').value}))draw()}
async function tg(id){await api('my/item_toggle',{id});draw()}
async function del(id){if(confirm('حذف؟')){await api('my/item_delete',{id});draw()}}

start(false,main);</script></body></html>
