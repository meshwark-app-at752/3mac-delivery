var CAT='',CATN={rest:'مطعم',groc:'بقالة',pharm:'صيدلية',shop:'متجر'};
function tilesHtml(){var n=[['rest','المطاعم'],['groc','البقالة'],['pharm','صيدليات'],['shop','المتاجر']];return '<div id=tiles>'+n.map(function(t){return '<div class="t on" data-c="'+t[0]+'" onclick="setCat(\''+t[0]+'\')"><img alt="'+t[1]+'" src="data:image/webp;base64,'+TILEIMG[t[0]]+'" style="'+(CAT==t[0]?'outline:3px solid #F55906;outline-offset:-3px':'')+'"><b>'+t[1]+'</b></div>'}).join('')+'</div>'}
function setCat(k){CATV=k;CUR=null;view='cat';render();window.scrollTo(0,0)}
function catView(){const N={rest:'المطاعم',groc:'البقالة',pharm:'صيدليات',shop:'المتاجر'};const L=RESTS.filter(function(r){return (r.cat||'rest')==CATV});return `<button class="alt bkb" onclick="go('home')">← رجوع</button><h3 style="margin:12px 4px">${N[CATV]||''} (${L.length})</h3><div id=clist>`+(L.length?L.map(restCard).join(''):'<div class=card style="text-align:center">لا يوجد شركاء في هذا القسم حاليًا، قريبًا</div>')+'</div>'}
function band(on){var b=document.getElementById('band');if(!on){if(b)b.remove();return}if(b)return;b=document.createElement('div');b.id='band';b.innerHTML=`<form class=sb id=sbf action=javascript:void(0) onsubmit="return sbGo(event)"><svg class=sbi onclick="sbGo()" viewBox="0 0 24 24" width=22 height=22 fill=none stroke="#B8B8B8" stroke-width=2 stroke-linecap=round><circle cx=11 cy=11 r=7></circle><path d="M20 20l-3.5-3.5"></path></svg><div id=sbph class=sbp${Q?' style="display:none"':''}><span>ابحث عن</span> <span id=sbw></span></div><input id=q type=search enterkeyhint=search autocomplete=off autocorrect=off aria-label="ابحث عن مطعم أو أكلة" value="${esc(Q)}" oninput="document.getElementById('sbph').style.display=this.value?'none':'';clearTimeout(window._s);window._s=setTimeout(doSearch,350)"></form><div class=bk><span><i data-t=3>3</i><b data-t=mak>mak</b></span></div>`;var h=document.querySelector('header');h.parentNode.insertBefore(b,h);fitBk()}
function fitBk(){var k=document.querySelector('#band .bk');if(!k)return;var sp=k.firstChild;k.style.fontSize='100px';var w=sp.getBoundingClientRect().width,a=k.clientWidth;if(w>0&&a>0)k.style.fontSize=(92*a/w)+'px'}window.addEventListener('resize',function(){fitBk()});if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){fitBk()});
function render(){cartBar();navBar();let h='';if(view!='home'&&view!='search')band(0);
 if(view=='search'){band(1);$('#app').innerHTML=searchView();return}
 if(view=='home'){band(1);h=tilesHtml()+'<div id=adv>'+bannerHtml()+'</div>'+tabs()+'<div id=bn></div><div id=list></div>';$('#app').innerHTML=h;document.body.classList.add('showlist');playAd();renderList();return}
 if(view=='account'){$('#app').innerHTML=accountView();return}
 if(view=='cat'){$('#app').innerHTML=catView();return}
 if(view=='orders'){h=tabs()+(ORDERS.length?ORDERS.map(orderCard).join(''):'<div class=card>لا توجد طلبات حتى الآن</div>')+'<div style="height:130px"></div>';$('#app').innerHTML=h;return}
 if(view=='menu'){$('#app').innerHTML=menuView();renderCart();return}

let prev={};
async function refresh(){if(view=='checkout')return;await loadRests();await loadOrders();
 if(view=='home'){const f=document.activeElement&&document.activeElement.id=='q';if(!f&&!Q)SR=null;if(!Q)renderList();else if(!f)renderList()}
 else if(view=='orders'||view=='cat')render()}
function navBar(){let n=document.getElementById('nv');if(!n){n=document.createElement('div');n.id='nv';document.body.appendChild(n)}n.style.display=view=='checkout'?'none':'flex';const a=view=='orders'?'orders':(view=='account'?'account':'home');const it=(k,i,t)=>'<button class="nvb'+(a==k?' on':'')+'" onclick="navGo(\''+k+'\')"><span class=nvi>'+i+'</span><span>'+t+'</span></button>';n.innerHTML=it('home','🏠','الرئيسية')+it('orders','🧾','طلباتي')+it('account','👤','حسابي')}
function navGo(k){window.scrollTo(0,0);if(k=='home'&&view=='home'){CATV='';CUR=null;render();return}go(k)}
function accountView(){const o=ORDERS[0]||{};const nm=o.name||localStorage.getItem('cname')||'';const ph=localStorage.getItem('cphone')||o.phone||'';const cp=window.SET&&SET.contact_phone?String(SET.contact_phone):'';return '<div class=card style="text-align:center"><img src=/logo3.png style="width:90px"><h3 style="margin:8px 0">حسابي</h3>'+(nm?'<div style="font-size:18px;font-weight:800">'+esc(nm)+'</div>':'')+(ph?'<div style="color:#1F1F1F;font-weight:800;font-size:17px;margin-top:4px;direction:ltr">'+esc(ph)+'</div>':'')+'</div>'+(cp?'<a class="acb" href="tel:'+esc(cp)+'">📞 اتصال بخدمة العملاء<small>'+esc(cp)+'</small></a>':'')+'<button class="acb out" onclick="askOut()">تسجيل الخروج</button>'}
